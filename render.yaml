# Blueprint do Render: no painel, New > Blueprint e escolha este repositório.
services:
  - type: web
    name: ta-ligado
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /saude
    # Só publica depois que o check "testes" (GitHub Actions) passar no commit do main.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Endereço do PostgreSQL da progressão (ex.: do Neon). O valor é preenchido no painel, nunca aqui.
      - key: DATABASE_URL
        sync: false
